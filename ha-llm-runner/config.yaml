name: "HA LLM Runner"
description: "LLM-powered data processor and predictor with pluggable LLM providers and MQTT Discovery."
version: "1.3.1"
slug: "ha_llm_runner"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
homeassistant_api: true
map:
  - config:rw
options:
  gemini_api_key: ""
  gemini_model: "gemini-3.5-flash-lite"
  audit_archive: true
  datetime_format: "%d.%m.%Y %H:%M:%S"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  gemini_api_key: password
  gemini_model: str
  audit_archive: bool
  timezone: str?
  datetime_format: str?
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password